[[secret]]
name = "NEXUS_DEVICE_TOKEN"
required = false

[[secret]]
name = "DATA_GOV_IN_API_KEY"
required = true
description = "API key for the official data.gov.in AGMARKNET daily mandi-price dataset. Used only by the server-side market endpoint."

[ai]
required = true
pin = "google"
description = "Google vision provider used for FarmWise plant-photo differential screening. Results are not a calibrated disease diagnosis."

[auth]
enabled = true
providers = ["email"]

[db.tables.farm_profiles]
read = "own"
write = "own"

[db.tables.sensor_readings]
read = "own"
write = "public"